name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p machina-daemon -p machina-run-as-user-helper --release

  libvirt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libvirt clients
        run: sudo apt-get update && sudo apt-get install -y libvirt-clients qemu-utils
      - run: chmod +x scripts/ci-libvirt-smoke.sh scripts/ci-kvm-lifecycle.sh
      - run: ./scripts/ci-libvirt-smoke.sh
      - run: ./scripts/ci-kvm-lifecycle.sh
      - run: cargo test -p machina-core

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run generate-openapi:check
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run api-ux-coverage:check
      - run: npm run test:e2e:install
      - run: npm run test:e2e

  live-ux:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:e2e:install
      - run: npm run test:e2e:live-ux
        env:
          PLAYWRIGHT_LIVE_URL: https://${{ secrets.LIVE_HOST }}:5092
          PLAYWRIGHT_LIVE_USER: ${{ secrets.LIVE_USER }}
          PLAYWRIGHT_LIVE_PASS: ${{ secrets.LIVE_PASS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-wiring-live-report
          path: docs/ux-wiring-live-report.json
