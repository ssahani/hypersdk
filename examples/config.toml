# ─────────────────────────────────────────────────────────────────────
# machina configuration
# ─────────────────────────────────────────────────────────────────────
#
# Config file locations (checked in order, first found wins):
#   1. /etc/machina/config.toml (system)
#   2. ~/.machina/config.toml (per-user)
#
# CLI arguments override all config file values.
# All settings below show the built-in defaults.

[general]
# How often the TUI polls the daemon for updated data (in seconds).
# Lower values give faster updates but increase API traffic.
# Range: 1-60 recommended.
refresh_interval_secs = 5

[guacamole]
# Optional Apache Guacamole encrypted JSON auth — same 32 hex chars as Docker JSON_SECRET_KEY.
# GET /api/v1/vms/{name}/guacamole-auth returns guac_data (+ optional token if fetch_token).
# enabled = false
# json_secret_hex = ""
# base_url = "http://127.0.0.1:8080/guacamole"
# public_vnc_host = ""
# fetch_token = true
# json_username = "machina"

[daemon]
# Address and port the daemon binds to.
# Use "0.0.0.0" to listen on all interfaces (default).
# Use "127.0.0.1" to restrict to localhost only.
host = "0.0.0.0"
port = 5092

[libvirt]
# Libvirt connection URI.
# Common values:
#   "qemu:///system"   — system VMs (requires root or libvirt group)
#   "qemu:///session"  — user-session VMs (no root needed)
#   "qemu+ssh://user@host/system" — remote host over SSH
#   "qemu+tcp://host/system"      — remote host over TCP
uri = "qemu:///system"
# VM create engine when the client omits `create_backend`: virt_install (default) or libvirt_xml.
# create_backend = "virt_install"
# Optional image builds via mkosi (`mkosi_workspace` API field). virt-builder stays off unless enabled.
# mkosi_allowed = true
# Legacy libguestfs virt-builder (only if you set virt_builder_allowed = true; install guestfs-tools).
# virt_builder_allowed = false
# virt_builder_default_ssh_pubkey_path = ""
# virt_builder_update = true
# virt_builder_default_packages = ["qemu-guest-agent"]
# virt_image_build_max_concurrent = 2
# virt_image_build_timeout_secs = 0
# virt_image_build_min_free_parent_bytes = 536870912
# virt_image_build_min_free_tmp_bytes = 268435456

# Browser SSH terminal (xterm.js): short-lived session ids, PTY + system `ssh`.
# [ssh_terminal]
# session_ttl_secs = 120
# allow_adhoc_hosts = true
# legacy_plain_host_websocket = false
# [[ssh_terminal.targets]]
# id = "lab-db"
# host = "192.168.122.50"
# ssh_user = "root"

# KubeVirt manifest defaults for GET /api/v1/vms/{name}/kubevirt-bundle (libvirt qcow2 → CDI + VM YAML).
# Optional: allow the daemon to run kubectl / virtctl on this host (same kubeconfig as your admin workstation).
# [kubevirt]
# default_namespace = "default"
# default_storage_class = "local-path"
# datavolume_padding_gi = 5
# virtio_container_disk_image = "quay.io/kubevirt/virtio-container-disk:latest"
# machine_type = "q35"
# exec_enabled = false
# kubectl_binary = "kubectl"
# virtctl_binary = "virtctl"
# kubeconfig_path = "/root/.kube/config"
# upload_timeout_minutes = 120
