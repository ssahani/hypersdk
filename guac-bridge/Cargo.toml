[package]
name = "libvirt-guac-bridge"
version = "0.1.0"
edition = "2021"
description = "MVP: libvirt display (virsh domdisplay) → Guacamole VNC connection + encrypted JSON auth"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "libvirt_guac_bridge"
path = "src/lib.rs"

[[bin]]
name = "libvirt-guac-bridge"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
openssl = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = "2"
