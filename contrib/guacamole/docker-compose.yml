# Apache Guacamole stack for machina (optional — install via scripts/install-guacamole.sh).
# guacd uses host networking so it can reach libvirt VNC on 127.0.0.1:590x.
services:
  guacd:
    image: docker.io/guacamole/guacd:1.6.0
    container_name: machina-guacd
    restart: unless-stopped
    network_mode: host

  postgres:
    image: docker.io/library/postgres:16
    container_name: machina-guac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guacamole_db}
      POSTGRES_USER: ${POSTGRES_USER:-guacamole_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - guac_pgdata:/var/lib/postgresql/data
    networks:
      - guac

  guacamole:
    image: docker.io/guacamole/guacamole:1.6.0
    container_name: machina-guacamole
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "${GUACAMOLE_BIND:-127.0.0.1}:${GUACAMOLE_PORT:-8081}:8080"
    environment:
      GUACD_HOSTNAME: 127.0.0.1
      GUACD_PORT: "4822"
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-guacamole_db}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-guacamole_user}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${JSON_SECRET_KEY:?set JSON_SECRET_KEY}
    networks:
      - guac

volumes:
  guac_pgdata:

networks:
  guac:
    driver: bridge
