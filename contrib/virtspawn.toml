# virtspawn daemon configuration
# Installed to /etc/virtspawn/config.toml
#
# User config at ~/.virtspawn/config.toml takes precedence.
# CLI arguments override all config file values.

[general]
refresh_interval_secs = 5

[daemon]
host = "0.0.0.0"
port = 8081

[libvirt]
uri = "qemu:///system"

[backup]
backup_dir = "/var/lib/virtspawn/backups"
# nfs_target = "192.168.1.100:/backups/virtspawn"
with_disks = false
retain = 7
