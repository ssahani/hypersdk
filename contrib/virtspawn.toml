# virtspawn daemon configuration — canonical path: /etc/virtspawn/config.toml
#
# VirtspawnConfig::load() tries /etc/virtspawn/config.toml first, then ~/.virtspawn/config.toml.
# systemd: ExecStart passes --config /etc/virtspawn/config.toml so the daemon always uses /etc.
# CLI (--host / --port / ...) overrides settings from the loaded file.

[general]
refresh_interval_secs = 5

[daemon]
host = "0.0.0.0"
# Omit `port` to use default 5092 (see DEFAULT_DAEMON_PORT in core)
port = 5092

[libvirt]
uri = "qemu:///system"
# VM create API default: "libvirt_xml" (native) or "virt_install" (hyper2kvm-style). Clients can override per request with `create_backend`.
create_backend = "libvirt_xml"
# Optional `virt-builder` integration (no golden image per OS): see CreateVmRequest `virt_builder_*` in API docs.
# virt_builder_allowed = true
# virt_builder_default_ssh_pubkey_path = "/var/lib/virtspawn/provision.pub"
# virt_builder_update = true
# Packages installed in every virt-builder VM; add qemu-guest-agent for domifaddr / IP detection.
# virt_builder_default_packages = ["qemu-guest-agent"]
# mkosi_allowed = true   # mkosi is the recommended disk image path; install.sh installs from GitHub when absent

[backup]
backup_dir = "/var/lib/virtspawn/backups"
# nfs_target = "192.168.1.100:/backups/virtspawn"
with_disks = false
retain = 7

# Web UI / session login: PAM service in /etc/pam.d/ (sshd = same rules as SSH password; "login" is TTY-oriented and often blocks root over the web).
[auth]
pam_service = "sshd"

# HTTPS is enabled by default (self-signed cert created by install.sh if missing).
[tls]
enabled = true
cert_path = "/etc/virtspawn/ssl/cert.pem"
key_path = "/etc/virtspawn/ssl/key.pem"
