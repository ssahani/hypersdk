# machina backup configuration
# Used by machina-backup.service / scripts/backup.sh
# Install to: /etc/machina/backup.conf
#
# NOTE: the installer places this file at mode 644 (world-readable) since, as
# shipped, it holds no secrets. backup.sh also accepts an optional `api_token`
# field here (or MACHINA_API_TOKEN in the environment — prefer the env var).
# If you add `api_token = ...` to this file, you MUST also run
# `chmod 600 /etc/machina/backup.conf` (root-owned) afterwards, or the bearer
# token is readable by any local user. Prefer leaving api_token unset and
# relying on the daemon-provisioned /var/lib/machina/service-tokens/machina-backup.token
# (already root-only 0600) instead of duplicating a token into this file.

# API endpoint (HTTPS; default matches daemon with TLS on :5092)
api_url = https://localhost:5092/api/v1

# Local backup directory (used when nfs_target is empty)
backup_dir = /var/lib/machina/backups

# NFS target (leave empty for local backups)
# Format: server:/export/path
# Examples:
#   nfs_target = 192.168.1.100:/backups/machina
#   nfs_target = nas.local:/volume1/vm-backups
nfs_target =

# NFS mount point (where the NFS share is mounted locally)
nfs_mount_point = /mnt/machina-backup

# NFS mount options
nfs_opts = vers=4,soft,timeo=30

# Unmount NFS after backup completes (true/false)
unmount_after = true

# Include disk images in backup (true/false)
# WARNING: disk images can be very large (tens of GB per VM)
with_disks = false

# Retention: keep only the last N backups (0 = keep all)
retain = 7
