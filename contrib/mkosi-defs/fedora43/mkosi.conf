[Distribution]
Distribution=fedora
Release=43

[Output]
Format=disk
ImageId=fedora43

[Build]
# ToolsTree provides a newer systemd-repart (254+) when the host ships an older one
# (e.g. AlmaLinux/RHEL 9 ships 252). Safe to keep on Fedora hosts too.
ToolsTree=yes
ToolsTreePackages=systemd-boot-unsigned

[Content]
Packages=
    systemd
    systemd-udev
    kernel
    dracut
    e2fsprogs
    dosfstools
    util-linux
    iproute
    iputils
    openssh-server
    passwd
    shadow-utils
    sudo
    vim-minimal
    qemu-guest-agent
Bootable=yes
