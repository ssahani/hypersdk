[Distribution]
Distribution=centos
Release=9

[Output]
Format=disk
ImageId=almalinux9

[Build]
ToolsTree=yes
ToolsTreePackages=systemd-boot-unsigned

[Content]
Packages=
    systemd
    systemd-udev
    kernel
    dracut
    e2fsprogs
    dosfstools
    util-linux
    iproute
    iputils
    openssh-server
    passwd
    shadow-utils
    sudo
    vim-minimal
    qemu-guest-agent
Bootable=yes
