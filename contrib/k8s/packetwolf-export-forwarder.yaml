# Machina Zeus — PacketWolf export forwarder for Tetragon (namespace-scoped log tail → ingest)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: packetwolf-export-forwarder
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: packetwolf-export-forwarder
    app.kubernetes.io/managed-by: machina-zeus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: packetwolf-export-forwarder-{{CLUSTER_TOKEN}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: packetwolf-export-forwarder
    app.kubernetes.io/managed-by: machina-zeus
rules:
  # forward.py only calls list_namespaced_pod/read_namespaced_pod_log against
  # TETRAGON_NAMESPACE (== this release's namespace) — scope to a namespaced
  # Role, not a cluster-wide ClusterRole, to avoid granting pod/log read
  # access in every other namespace in the cluster.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: packetwolf-export-forwarder-{{CLUSTER_TOKEN}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: packetwolf-export-forwarder
    app.kubernetes.io/managed-by: machina-zeus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: packetwolf-export-forwarder-{{CLUSTER_TOKEN}}
subjects:
  - kind: ServiceAccount
    name: packetwolf-export-forwarder
    namespace: {{NAMESPACE}}
---
apiVersion: v1
kind: Secret
metadata:
  name: packetwolf-export-forwarder
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: packetwolf-export-forwarder
    app.kubernetes.io/managed-by: machina-zeus
type: Opaque
stringData:
  api-key: "{{API_KEY}}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: packetwolf-export-forwarder
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: packetwolf-export-forwarder
    app.kubernetes.io/managed-by: machina-zeus
data:
  forward.py: |
{{FORWARD_SCRIPT}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: packetwolf-export-forwarder
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: packetwolf-export-forwarder
    app.kubernetes.io/managed-by: machina-zeus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: packetwolf-export-forwarder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: packetwolf-export-forwarder
    spec:
      serviceAccountName: packetwolf-export-forwarder
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: false  # pip install below writes to site-packages; see note
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forwarder
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-eu", "-c"]
          args:
            # Pin the client version: an unpinned `pip install kubernetes`
            # pulls whatever release is newest on every pod (re)start,
            # which is a supply-chain/reproducibility risk. Bump deliberately.
            - pip install -q "kubernetes==29.0.0" && exec python /config/forward.py
          env:
            - name: PACKETWOLF_EXPORT_URL
              value: "{{EXPORT_URL}}"
            - name: PACKETWOLF_HOST_ID
              value: "{{HOST_ID}}"
            - name: TETRAGON_NAMESPACE
              value: "{{NAMESPACE}}"
            - name: TETRAGON_LABEL_SELECTOR
              value: "app.kubernetes.io/name=tetragon"
            - name: PACKETWOLF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: packetwolf-export-forwarder
                  key: api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: packetwolf-export-forwarder
