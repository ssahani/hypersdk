services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    # Only the packetwolf container talks to ClickHouse (via the compose
    # network's internal DNS, "clickhouse:8123"); it does not need to be
    # reachable from other hosts. No auth is configured on this instance,
    # so bind to loopback only (still reachable for local debugging via
    # clickhouse-client/curl on the docker host) instead of 0.0.0.0.
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./schema/clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: packetwolf

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    # Same reasoning as clickhouse above: only packetwolf needs this,
    # reached internally as "opensearch:9200". Security plugin is disabled,
    # so avoid exposing it on all interfaces.
    ports:
      - "127.0.0.1:9200:9200"

  packetwolf:
    build: .
    restart: unless-stopped
    # Left on 0.0.0.0 (default) intentionally: remote hosts in the fleet
    # run a Tetragon export timer that POSTs JSONL batches to this
    # service's /api/v1/ingest/{host_id} endpoint over the network, and the
    # Machina controller may reach it from a different host too.
    ports:
      - "9091:9091"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      OPENSEARCH_URL: http://opensearch:9200
      PACKETWOLF_DEMO: "0"
    depends_on:
      - clickhouse
      - opensearch
