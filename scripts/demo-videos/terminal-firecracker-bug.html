<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="terminal-engine.css">
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
      <div class="titletext">sus@175.110.122.71 — a real boot bug, found live</div>
    </div>
    <div class="body" id="term"></div>
  </div>
<script>
window.TERM_PROMPT = 'sus@lab-host:~$ ';
// Real console output captured while debugging the first Firecracker
// sprite boot on 175.110.122.71, trimmed for pacing — nothing here is
// fabricated or reworded.
window.TERM_STEPS = [
  { type: 'out', cls: 'hl', text: 'Attempt 1 — boot the golden image straight off a partitioned raw disk:', hold: 300, afterHold: 800 },
  { type: 'out', cls: 'plain', text:
`[    0.006233] Kernel command line: console=ttyS0 reboot=k panic=1 pci=off \\
    root=/dev/vda1 rw pci=off root=/dev/vda rw virtio_mmio.device=4K@0xc0001000:5` , afterHold: 1200 },
  { type: 'out', cls: 'plain', text:
`[    0.670486] List of all partitions:
[    0.670501]  driver: virtio_blk
[    0.671317]   fe01         3670015 vda1 00000000-01
[    0.672087] No filesystem could mount root, tried:
[    0.672090]  ext3
[    0.672676]  ext2
[    0.672923]  ext4
[    0.673178]  squashfs
[    0.673424]  fuseblk
[    0.673705]  xfs`, afterHold: 1200 },
  { type: 'out', cls: 'bad', text: '[    0.674429] Kernel panic - not syncing: VFS: Unable to mount root fs on "/dev/vda" or unknown-block(254,0)', hold: 400, afterHold: 2200 },
  { type: 'out', cls: 'hl', text: 'Root cause: Firecracker auto-appends "root=/dev/vda rw" (whole-disk, no partition) for the drive marked is_root_device — after whatever boot_args the caller supplies. Last root= wins; mine lost. Documented upstream: firecracker-microvm/firecracker#2709.', hold: 300, afterHold: 2200 },
  { type: 'out', cls: 'hl', text: 'Fix: extract partition 1’s content into an unpartitioned raw file (sfdisk -d + dd) instead of handing Firecracker a whole partitioned disk.', hold: 300, afterHold: 1600 },
  { type: 'out', cls: 'hl', text: 'Attempt 2 — same golden image, root partition extracted first:', hold: 300, afterHold: 1000 },
  { type: 'out', cls: 'plain', text: '[    1.601392] EXT4-fs (vda): re-mounted e4a26442-23a2-4e3b-9caf-09ebe5f7bccb.', afterHold: 900 },
  { type: 'out', cls: 'plain', text:
`[  OK  ] Started systemd-journald.service - Journal Service.
[  OK  ] Started systemd-udevd.service - Rule-based Manager for Device Events and Files.
[  OK  ] Started systemd-networkd.service - Network Configuration.`, afterHold: 1200 },
  { type: 'out', cls: 'ok', text: 'Boots clean. Confirmed live with a real DHCP lease, SSH login, and internet access — see the CLI demo.', hold: 400, afterHold: 2000 },
];
</script>
<script src="terminal-engine.js"></script>
</body>
</html>
