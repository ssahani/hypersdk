[package]
name = "virtspawn-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
virt = "0.4"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
tower-http = { version = "0.6", features = ["cors"] }
serde_yaml = "0.9"
